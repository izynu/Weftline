<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" role="img" aria-label="Weftline five pass pipeline">
  <!-- Weftline method pipeline: Unpick, Warp, Weave, Finish, Proof.
       Cards pulse gently in sequence, connectors flow left to right.
       Declarative SMIL animation only, no scripts. -->
  <rect width="1200" height="240" rx="18" fill="#121214"/>
  <rect x="0.75" y="0.75" width="1198.5" height="238.5" rx="17.25" fill="none" stroke="#2a2a31" stroke-width="1.5"/>

  <!-- connectors -->
  <g stroke="#2a2a31" stroke-width="2">
    <line x1="205" y1="112" x2="260" y2="112"/>
    <line x1="450" y1="112" x2="505" y2="112"/>
    <line x1="695" y1="112" x2="750" y2="112"/>
    <line x1="940" y1="112" x2="995" y2="112"/>
  </g>
  <g stroke-width="2.5" stroke-dasharray="6 8" fill="none">
    <line x1="205" y1="112" x2="260" y2="112" stroke="#eca43c" opacity="0.85">
      <animate attributeName="stroke-dashoffset" values="0;-14" dur="1.1s" repeatCount="indefinite"/>
    </line>
    <line x1="450" y1="112" x2="505" y2="112" stroke="#4cc38a" opacity="0.85">
      <animate attributeName="stroke-dashoffset" values="0;-14" dur="1.1s" begin="-0.4s" repeatCount="indefinite"/>
    </line>
    <line x1="695" y1="112" x2="750" y2="112" stroke="#b8b8c0" opacity="0.85">
      <animate attributeName="stroke-dashoffset" values="0;-14" dur="1.1s" begin="-0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="940" y1="112" x2="995" y2="112" stroke="#e5484d" opacity="0.85">
      <animate attributeName="stroke-dashoffset" values="0;-14" dur="1.1s" begin="-0.2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- 01 Unpick -->
  <g>
    <animate attributeName="opacity" values="1;0.8;1" dur="5s" begin="0s" repeatCount="indefinite"/>
    <rect x="15" y="64" width="190" height="96" rx="12" fill="#19191c" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="33" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#2dd4bf">01</text>
    <text x="33" y="122" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#ecedf0">Unpick</text>
    <text x="33" y="144" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9c9ca6">understand before touching</text>
  </g>

  <!-- 02 Warp -->
  <g>
    <animate attributeName="opacity" values="1;0.8;1" dur="5s" begin="1s" repeatCount="indefinite"/>
    <rect x="260" y="64" width="190" height="96" rx="12" fill="#19191c" stroke="#eca43c" stroke-width="1.5"/>
    <text x="278" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#eca43c">02</text>
    <text x="278" y="122" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#ecedf0">Warp</text>
    <text x="278" y="144" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9c9ca6">plan at the right depth</text>
  </g>

  <!-- 03 Weave -->
  <g>
    <animate attributeName="opacity" values="1;0.8;1" dur="5s" begin="2s" repeatCount="indefinite"/>
    <rect x="505" y="64" width="190" height="96" rx="12" fill="#19191c" stroke="#4cc38a" stroke-width="1.5"/>
    <text x="523" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#4cc38a">03</text>
    <text x="523" y="122" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#ecedf0">Weave</text>
    <text x="523" y="144" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9c9ca6">implement cleanly</text>
  </g>

  <!-- 04 Finish -->
  <g>
    <animate attributeName="opacity" values="1;0.8;1" dur="5s" begin="3s" repeatCount="indefinite"/>
    <rect x="750" y="64" width="190" height="96" rx="12" fill="#19191c" stroke="#b8b8c0" stroke-width="1.5"/>
    <text x="768" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#b8b8c0">04</text>
    <text x="768" y="122" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#ecedf0">Finish</text>
    <text x="768" y="144" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9c9ca6">make it feel finished</text>
  </g>

  <!-- 05 Proof -->
  <g>
    <animate attributeName="opacity" values="1;0.8;1" dur="5s" begin="4s" repeatCount="indefinite"/>
    <rect x="995" y="64" width="190" height="96" rx="12" fill="#19191c" stroke="#e5484d" stroke-width="1.5"/>
    <text x="1013" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#e5484d">05</text>
    <text x="1013" y="122" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#ecedf0">Proof</text>
    <text x="1013" y="144" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#9c9ca6">verify, never claim</text>
  </g>

  <!-- depth tier chips -->
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
    <rect x="413" y="188" width="86" height="24" rx="6" fill="#19191c" stroke="#2a2a31"/>
    <text x="456" y="204" text-anchor="middle" fill="#9c9ca6">Patch</text>
    <rect x="509" y="188" width="86" height="24" rx="6" fill="#19191c" stroke="#2a2a31"/>
    <text x="552" y="204" text-anchor="middle" fill="#9c9ca6">Page</text>
    <rect x="605" y="188" width="86" height="24" rx="6" fill="#19191c" stroke="#2a2a31"/>
    <text x="648" y="204" text-anchor="middle" fill="#9c9ca6">System</text>
    <rect x="701" y="188" width="86" height="24" rx="6" fill="#19191c" stroke="#2a2a31"/>
    <text x="744" y="204" text-anchor="middle" fill="#9c9ca6">Motion</text>
    <text x="397" y="204" text-anchor="end" fill="#6d6d76">depth tiers</text>
  </g>
</svg>
